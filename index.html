<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>전세계/서울 교회 현황 지도 v3</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
html,body{height:100%;margin:0;font-family:system-ui;}
#map{height:100%;}
header{
position:fixed;top:0;left:0;right:0;
background:#fff;padding:12px;
z-index:2000;border-bottom:1px solid #eee;
}
#wrap{position:fixed;top:120px;left:0;right:0;bottom:0;}
</style>
</head>

<body>

<header>
<b>전세계/서울 교회 현황 지도 v3</b>
<span id="status" style="margin-left:20px;color:#666;">대기 중…</span>
</header>

<div id="wrap">
<div id="map"></div>
</div>

<script>
const map = L.map('map').setView([20,0],2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19,
attribution:'© OpenStreetMap'
}).addTo(map);

const cluster = L.markerClusterGroup({
showCoverageOnHover:false,
disableClusteringAtZoom:16,
chunkedLoading:true
});
map.addLayer(cluster);

function setStatus(msg){
document.getElementById('status').textContent = msg;
}

function parseNumber(x){
const n = Number(x);
return Number.isFinite(n) ? n : null;
}

function parseCSV(text){
const rows=[];
let cur='', inQuotes=false;
const out=[];
for(let i=0;i<text.length;i++){
const ch=text[i];
const next=text[i+1];
if(ch === '"'){
if(inQuotes && next === '"'){ cur+='"'; i++; }
else inQuotes=!inQuotes;
}
else if(ch===',' && !inQuotes){
out.push(cur); cur='';
}
else if((ch==='\n'||ch==='\r') && !inQuotes){
if(ch==='\r' && next==='\n') i++;
out.push(cur); cur='';
if(out.some(v=>v.trim()!=='')) rows.push(out.slice());
out.length=0;
}
else cur+=ch;
}
out.push(cur);
if(out.some(v=>v.trim()!=='')) rows.push(out.slice());
return rows;
}

function rowsToObjects(rows){
if(!rows.length) return [];
const header = rows[0].map(h=>h.trim());
const objs=[];
for(let i=1;i<rows.length;i++){
const r=rows[i];
const o={};
for(let c=0;c<header.length;c++){
o[header[c]] = r[c] ?? '';
}
objs.push(o);
}
return objs;
}

function googlePin(color){
return L.divIcon({
className:"",
iconSize:[26,36],
iconAnchor:[13,36],
html:`
<svg width="26" height="36" viewBox="0 0 24 34">
<path d="M12 34s10-12.2 10-20C22 6.3 17.5 2 12 2S2 6.3 2 14c0 7.8 10 20 10 20z"
fill="${color}" stroke="rgba(255,255,255,.6)" stroke-width="1.2"/>
<circle cx="12" cy="14" r="6.5" fill="white"/>
<circle cx="12" cy="14" r="4.8" fill="${color}"/>
</svg>`
});
}

function iconByStatus(status){
const s = String(status||'').toLowerCase();
if(s.includes('새성전')) return googlePin('#ef4444');
if(s.includes('헌당') || s.includes('현당')) return googlePin('#3b82f6');
return googlePin('#f59e0b');
}

async function loadWorld(){
setStatus('자동 로드 중…');
try{
const res = await fetch(`data/churches.csv?v=${Date.now()}`,{cache:'no-store'});
if(!res.ok) throw new Error();

const text = await res.text();
const rows = parseCSV(text);
const items = rowsToObjects(rows);

cluster.clearLayers();

let count=0;

for(const o of items){
let lat = parseNumber(o.lat);
let lng = parseNumber(o.lng);

if(lat==null || lng==null) continue;

/* 좌표 뒤집힘 자동 교정 */
if((lat>90 && Math.abs(lng)<=90) || (lat>100 && lng<60)){
const tmp = lat;
lat = lng;
lng = tmp;
}

const marker = L.marker([lat,lng],{
icon: iconByStatus(o.status)
}).bindPopup(`
<b>${o.name||''}</b><br>
${o.address||''}
`);

cluster.addLayer(marker);
count++;
}

if(count) map.fitBounds(cluster.getBounds(),{padding:[20,20]});

setStatus(`자동 업데이트 완료 ✅ ${count}개`);

}catch(e){
setStatus('data/churches.csv 확인 필요');
}
}

/* 시작 시 자동 로드 */
loadWorld();
</script>

</body>
</html>
