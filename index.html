<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>전세계 하나님의교회 지도</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
html,body{height:100%;margin:0;font-family:sans-serif}
#map{height:100%}
header{position:fixed;top:0;left:0;right:0;background:#fff;padding:10px;z-index:1000;border-bottom:1px solid #ddd}
#mapWrap{position:absolute;top:70px;bottom:0;left:0;right:0}
.status{font-size:13px;color:#555}
</style>
</head>

<body>

<header>
  <b>전세계 하나님의교회 지도</b>
  <span class="status" id="status">자동 로드 중...</span>
</header>

<div id="mapWrap">
  <div id="map"></div>
</div>

<script>

const $ = id => document.getElementById(id);

const map = L.map('map',{worldCopyJump:true}).setView([20,0],2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'© OpenStreetMap'
}).addTo(map);

const cluster = L.markerClusterGroup({chunkedLoading:true});
map.addLayer(cluster);

let allItems = [];
let populationMap = new Map();

function setStatus(t){ $('status').textContent = t; }

function stripBOM(s){ return String(s||'').replace(/^\uFEFF/, ''); }

function parseNumber(x){
  const n = Number(x);
  return Number.isFinite(n)?n:null;
}

function parseCSV(text){
  const rows=[];
  let cur='',inQuotes=false;
  const out=[];
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch=='"'){
      if(inQuotes&&next=='"'){cur+='"';i++;}
      else inQuotes=!inQuotes;
    }else if(ch==','&&!inQuotes){
      out.push(cur);cur='';
    }else if((ch=='\n'||ch=='\r')&&!inQuotes){
      if(ch=='\r'&&next=='\n')i++;
      out.push(cur);cur='';
      rows.push(out.slice());out.length=0;
    }else cur+=ch;
  }
  out.push(cur);
  rows.push(out);
  return rows;
}

function rowsToObjects(rows){
  if(!rows.length) return [];
  const header=rows[0].map(h=>stripBOM(h.trim()));
  const objs=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i],o={};
    for(let c=0;c<header.length;c++){
      o[header[c]]=r[c]||'';
    }
    objs.push(o);
  }
  return objs;
}

/* ===== CSV 한줄 복구 ===== */
function repairChurchCSV(text){
  const s=stripBOM(text);
  if(s.includes('\n')) return s;
  const idx=s.indexOf('status');
  if(idx==-1) return s;
  const header=s.slice(0,idx+6);
  let body=s.slice(idx+6).trim();
  body=body.replace(/\s+(?=\d+,)/g,"\n");
  return header+"\n"+body;
}

function repairPopulationCSV(text){
  const s=stripBOM(text);
  if(s.includes('\n')) return s;
  const idx=s.indexOf('population');
  if(idx==-1) return s;
  const header=s.slice(0,idx+10);
  let body=s.slice(idx+10).trim();
  body=body.replace(/\s+(?=[A-Za-z][^,]*,)/g,"\n");
  return header+"\n"+body;
}

/* ===== 자동 로드 ===== */
async function loadWorld(){

  setStatus("전세계 데이터 불러오는 중...");

  try{

    let churchRes = await fetch("./output_with_coords.csv",{cache:'no-store'});
    let churchText = await churchRes.text();
    churchText = repairChurchCSV(churchText);

    const rows = parseCSV(churchText);
    allItems = rowsToObjects(rows);

    try{
      let popRes = await fetch("./population.csv",{cache:'no-store'});
      let popText = await popRes.text();
      popText = repairPopulationCSV(popText);
      const popRows=parseCSV(popText);
      const popObjs=rowsToObjects(popRows);
      for(const p of popObjs){
        const key=p.country+"|"+p.city+"|"+p.district;
        populationMap.set(key,parseNumber(p.population));
      }
    }catch(e){}

    render();

  }catch(e){
    console.error(e);
    setStatus("CSV 로드 실패 - 파일 존재 확인");
  }
}

function render(){

  cluster.clearLayers();

  let count=0;

  for(const it of allItems){

    const lat=parseNumber(it.lat);
    const lng=parseNumber(it.lng);

    if(lat==null||lng==null) continue;

    const marker=L.marker([lat,lng]).bindPopup(
      `<b>${it.name}</b><br>${it.address||''}`
    );

    cluster.addLayer(marker);
    count++;
  }

  if(count){
    map.fitBounds(cluster.getBounds());
  }

  setStatus(`로드 완료 ✅ ${count.toLocaleString()}개`);
}

loadWorld();

</script>
</body>
</html>
