<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>하나님의교회 지도</title>
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=73b507fb754b2820529d8dc82b379259"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  var container = document.getElementById('map');

  var options = {
    center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울
    level: 5
  };

  var map = new kakao.maps.Map(container, options);

  // 마커 추가
  var markerPosition = new kakao.maps.LatLng(37.5665, 126.9780);

  var marker = new kakao.maps.Marker({
    position: markerPosition
  });

  marker.setMap(map);
</script>

</body>
</html>
