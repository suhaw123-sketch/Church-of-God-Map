<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>교회 지도 (좌표 자동 생성 포함)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:sans-serif; }
#map { height:90vh; }
header { padding:10px; border-bottom:1px solid #ddd; }
button { margin-right:8px; }
</style>
</head>

<body>

<header>
  <button id="btnLoad">CSV 불러오기</button>
  <input type="file" id="file" accept=".csv"/>
  <button id="btnAutoCoordDownload">좌표 생성 + 다운로드</button>
  <span id="status">대기중</span>
</header>

<div id="map"></div>

<script>
// ================= 지도 =================
const map = L.map('map').setView([37.5665,126.9780], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

let markers = [];

// ================= 상태 =================
function setStatus(msg){
  document.getElementById('status').textContent = msg;
}

// ================= CSV 파싱 =================
function parseCSV(text){
  const lines = text.split('\n');
  const headers = lines[0].split(',');
  return lines.slice(1).map(line=>{
    const values = line.split(',');
    const obj = {};
    headers.forEach((h,i)=> obj[h.trim()] = values[i]);
    return obj;
  });
}

// ================= 데이터 =================
let allItems = [];

// ================= CSV 로드 =================
document.getElementById('file').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  const text = await file.text();
  allItems = parseCSV(text);
  setStatus(`로드 완료 (${allItems.length})`);
  render();
});

// ================= 지도 표시 =================
function render(){
  markers.forEach(m=>map.removeLayer(m));
  markers = [];

  allItems.forEach(it=>{
    if(it.lat && it.lng){
      const m = L.marker([it.lat, it.lng])
        .addTo(map)
        .bindPopup(it.name || '');
      markers.push(m);
    }
  });
}

// ================= 카카오 API =================
const REST_API_KEY = "여기에_카카오_API키";

async function geocodeAddress(address){
  const url = `https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(address)}`;

  try{
    const res = await fetch(url,{
      headers:{ Authorization:`KakaoAK ${REST_API_KEY}` }
    });

    const data = await res.json();

    if(data.documents.length){
      return {
        lat: parseFloat(data.documents[0].y),
        lng: parseFloat(data.documents[0].x)
      };
    }
  }catch(e){
    console.error(e);
  }

  return null;
}

// ================= CSV 다운로드 =================
function downloadCSV(data){
  const header = Object.keys(data[0]).join(',');

  const rows = data.map(row =>
    Object.values(row).map(v=>`"${v}"`).join(',')
  );

  const csv = [header,...rows].join('\n');

  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result.csv';
  a.click();
}

// ================= 좌표 자동 생성 =================
async function generateCoordsAndDownload(){

  if(!allItems.length){
    alert('CSV 먼저 넣어');
    return;
  }

  setStatus('좌표 생성 중...');

  let success=0, fail=0;

  for(const it of allItems){

    if(it.lat && it.lng) continue;

    const addr = `${it.address}`;

    const coord = await geocodeAddress(addr);

    if(coord){
      it.lat = coord.lat;
      it.lng = coord.lng;
      success++;
    }else{
      fail++;
    }

    await new Promise(r=>setTimeout(r,200));
  }

  setStatus(`완료 성공:${success} 실패:${fail}`);

  render();
  downloadCSV(allItems);
}

// ================= 버튼 =================
document.getElementById('btnAutoCoordDownload').onclick = generateCoordsAndDownload;

</script>

</body>
</html>
