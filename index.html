<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교회 위치 지도</title>

<!-- 카카오맵 API -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=73b507fb754b2820529d8dc82b379259"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100vh;
}

#loading {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #000;
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 10;
}
</style>
</head>

<body>

<div id="loading">📍 교회 위치 불러오는 중...</div>
<div id="map"></div>

<script>
// ============================
// 1. 지도 생성
// ============================
const mapContainer = document.getElementById('map');

const mapOption = {
  center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울 기준
  level: 8
};

const map = new kakao.maps.Map(mapContainer, mapOption);

// ============================
// 2. CSV 불러오기
// ============================
fetch('data/churches.csv')
  .then(response => response.text())
  .then(csvText => {

    const lines = csvText.split('\n');

    // 첫 줄(header) 제거
    lines.shift();

    let markers = [];

    lines.forEach(line => {
      const cols = line.split(',');

      // CSV 구조: 이름,위도,경도
      const name = cols[0];
      const lat = parseFloat(cols[1]);
      const lng = parseFloat(cols[2]);

      if (!lat || !lng) return;

      const markerPosition = new kakao.maps.LatLng(lat, lng);

      const marker = new kakao.maps.Marker({
        position: markerPosition
      });

      marker.setMap(map);

      // 인포윈도우
      const infowindow = new kakao.maps.InfoWindow({
        content: `<div style="padding:5px;">${name}</div>`
      });

      kakao.maps.event.addListener(marker, 'click', function () {
        infowindow.open(map, marker);
      });

      markers.push(marker);
    });

    // 로딩 제거
    document.getElementById('loading').style.display = 'none';

    console.log("총 마커 수:", markers.length);
  })
  .catch(error => {
    console.error('CSV 로딩 실패:', error);
  });

</script>

</body>
</html>
