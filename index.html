<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>전세계/서울 교회 지도 v3</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>

<style>
body{margin:0;font-family:sans-serif;background:#f5f6f7}
header{padding:10px 20px;font-size:22px;font-weight:bold}
.toolbar{padding:10px;display:flex;gap:10px;flex-wrap:wrap}
#map{height:500px}
.panel{display:flex}
.list{width:300px;background:#fff;padding:10px;overflow:auto}
.card{padding:10px;border-bottom:1px solid #eee}
button{padding:6px 10px;border-radius:6px;border:1px solid #ccc;cursor:pointer}
</style>
</head>

<body>

<header>전세계/서울 교회 현황 지도 v3</header>

<div class="toolbar">
<input type="file" id="fileInput">
<button id="btnAutoCoord">좌표 자동 생성</button>
<button id="btnRender">지도 표시</button>
</div>

<div class="panel">
<div id="map"></div>
<div class="list" id="list"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
// ================= 기본 =================
const map = L.map('map').setView([37.5665,126.9780], 3);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

let allItems = [];
let markersLayer = null;

// ================= CSV 로드 =================
document.getElementById('fileInput').addEventListener('change',function(e){

  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(e){
    const rows = e.target.result.split('\n').slice(1);

    allItems = rows.map(r=>{
      const cols = r.split(',');

      return {
        name: cols[0],
        address: cols[1],
        lat: parseFloat(cols[2]),
        lng: parseFloat(cols[3])
      };
    });

    render(allItems);
  };

  reader.readAsText(file);
});

// ================= 렌더 =================
function render(items){

  if(markersLayer){
    markersLayer.clearLayers();
  }

  markersLayer = L.markerClusterGroup();

  items.forEach(it=>{

    if(!it.lat || !it.lng) return;

    const marker = L.marker([it.lat,it.lng]);

    marker.bindPopup(`<b>${it.name}</b><br>${it.address}`);

    markersLayer.addLayer(marker);
  });

  map.addLayer(markersLayer);
  updateList(items);
}

// ================= 리스트 =================
function updateList(items){

  const el = document.getElementById('list');
  el.innerHTML = '';

  items.forEach(it=>{
    const div = document.createElement('div');
    div.className='card';
    div.innerHTML = `<b>${it.name}</b><br>${it.address}`;
    el.appendChild(div);
  });
}

// ================= 카카오 API =================
const REST_API_KEY = "여기에_카카오_API키";

async function geocodeAddress(address){

  const url = `https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(address)}`;

  const res = await fetch(url,{
    headers:{Authorization:`KakaoAK ${REST_API_KEY}`}
  });

  const data = await res.json();

  if(data.documents.length){
    return {
      lat: parseFloat(data.documents[0].y),
      lng: parseFloat(data.documents[0].x)
    };
  }

  return null;
}

// ================= 좌표 생성 =================
async function generateCoords(){

  let success=0, fail=0;

  for(const it of allItems){

    if(it.lat && it.lng) continue;

    const coord = await geocodeAddress(it.address);

    if(coord){
      it.lat = coord.lat;
      it.lng = coord.lng;
      success++;
    }else{
      fail++;
    }

    await new Promise(r=>setTimeout(r,200));
  }

  alert(`완료 성공:${success} 실패:${fail}`);

  render(allItems);
}

// ================= 버튼 =================
document.getElementById('btnAutoCoord').onclick = generateCoords;
document.getElementById('btnRender').onclick = ()=>render(allItems);

</script>

</body>
</html>
