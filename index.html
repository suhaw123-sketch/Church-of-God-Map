<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>교회 지도 완성판</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
html,body{height:100%;margin:0;}
#map{height:100%;}
header{padding:10px;border-bottom:1px solid #ddd;}
button{margin-right:5px;}
</style>
</head>

<body>

<header>
<button id="btnLoad">데이터 로드</button>
<button id="btnSeoul">서울만 보기</button>
<span id="status">대기중</span>
</header>

<div id="map"></div>

<script>
const POP_RATE = 0.03;

const map = L.map('map').setView([20,0],2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

const cluster = L.markerClusterGroup();
map.addLayer(cluster);

let allItems = [];
let populationMap = new Map();

function parseNumber(x){
  const n = Number(x);
  return Number.isFinite(n) ? n : null;
}

function adminKey(c,ci,d){
  return `${c}|${ci}|${d}`;
}

/* =========================
   ✔ 교회당 인구 계산
========================= */
function computePeoplePerChurch(items){
  const countMap = new Map();

  for(const it of items){
    const k = it.key;
    countMap.set(k,(countMap.get(k)||0)+1);
  }

  for(const it of items){
    if(it.population){
      const count = countMap.get(it.key)||1;
      it.ppc = Math.round((it.population*POP_RATE)/count);
    }
  }
}

/* =========================
   ✔ 데이터 렌더
========================= */
async function render(items){

  cluster.clearLayers();

  const normalized = items.map(it=>{
    return {
      name: it.name,
      lat: parseNumber(it.lat),
      lng: parseNumber(it.lng),
      country: it.country,
      city: it.city,
      district: it.district,
      population: populationMap.get(
        adminKey(it.country,it.city,it.district)
      ),
      key: adminKey(it.country,it.city,it.district)
    }
  }).filter(it=>it.lat && it.lng);

  computePeoplePerChurch(normalized);

  for(const it of normalized){

    const marker = L.marker([it.lat,it.lng]);

    marker.bindPopup(`
      <b>${it.name}</b><br>
      ${it.city}<br>
      ${
        it.ppc 
        ? `교회당 인구: ${it.ppc.toLocaleString()}`
        : `인구 없음`
      }
    `);

    cluster.addLayer(marker);
  }

  if(cluster.getBounds().isValid()){
    map.fitBounds(cluster.getBounds());
  }

  document.getElementById("status").textContent =
    `표시 ${normalized.length}개`;
}

/* =========================
   ✔ 샘플 데이터
========================= */
const sampleData = [
  {name:"강남교회", lat:37.5, lng:127.02, country:"South Korea", city:"Seoul", district:"강남구"},
  {name:"서초교회", lat:37.48, lng:127.01, country:"South Korea", city:"Seoul", district:"서초구"},
  {name:"부산교회", lat:35.18, lng:129.07, country:"South Korea", city:"Busan", district:"해운대구"}
];

const samplePop = [
  {country:"South Korea", city:"Seoul", district:"강남구", population:550000},
  {country:"South Korea", city:"Seoul", district:"서초구", population:430000},
  {country:"South Korea", city:"Busan", district:"해운대구", population:420000}
];

/* =========================
   ✔ 버튼 이벤트
========================= */
document.getElementById("btnLoad").onclick = async ()=>{
  allItems = sampleData;

  populationMap.clear();
  for(const p of samplePop){
    populationMap.set(
      adminKey(p.country,p.city,p.district),
      p.population
    );
  }

  await render(allItems);
};

document.getElementById("btnSeoul").onclick = async ()=>{
  const seoul = allItems.filter(it=>it.city==="Seoul");
  await render(seoul);
};

</script>

</body>
</html>
