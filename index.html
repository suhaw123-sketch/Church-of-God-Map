<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>전세계/서울 교회 현황 지도 v3 (지역/나라 필터 + 우측목록 + 인구비율)</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- PapaParse (CSV 파싱용) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 75%; float: left; }
    #sidebar { height: 100%; width: 25%; float: left; overflow-y: auto; padding: 10px; box-sizing: border-box; border-left: 1px solid #ccc; }
    .church-item { cursor: pointer; margin-bottom: 8px; padding: 4px; border-bottom: 1px solid #eee; }
    .church-item:hover { background-color: #f0f0f0; }
    #filters { margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <div id="filters">
      <label for="countryFilter">나라: </label>
      <select id="countryFilter"><option value="">전체</option></select>
      <br>
      <label for="cityFilter">지역: </label>
      <select id="cityFilter"><option value="">전체</option></select>
    </div>
    <div id="churchList"></div>
  </div>

  <script>
    var map = L.map('map').setView([37.5665, 126.9780], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var markers = L.markerClusterGroup();
    var allChurches = []; // 모든 교회 데이터 저장

    // CSV 불러오기
    Papa.parse('data/churches.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allChurches = results.data.filter(c => c.lat && c.lng);
        setupFilters();
        updateMapAndList();
      }
    });

    function setupFilters() {
      var countries = [...new Set(allChurches.map(c => c.country))];
      var cities = [...new Set(allChurches.map(c => c.city))];

      var countrySelect = document.getElementById('countryFilter');
      countries.forEach(function(c) {
        var option = document.createElement('option');
        option.value = c;
        option.textContent = c;
        countrySelect.appendChild(option);
      });

      var citySelect = document.getElementById('cityFilter');
      cities.forEach(function(c) {
        var option = document.createElement('option');
        option.value = c;
        option.textContent = c;
        citySelect.appendChild(option);
      });

      countrySelect.addEventListener('change', updateMapAndList);
      citySelect.addEventListener('change', updateMapAndList);
    }

    function updateMapAndList() {
      markers.clearLayers();
      var country = document.getElementById('countryFilter').value;
      var city = document.getElementById('cityFilter').value;

      var filtered = allChurches.filter(c => {
        return (!country || c.country === country) &&
               (!city || c.city === city);
      });

      var churchList = document.getElementById('churchList');
      churchList.innerHTML = '';

      filtered.forEach(function(church) {
        var marker = L.marker([parseFloat(church.lat), parseFloat(church.lng)])
                      .bindPopup("<b>" + church.name + "</b><br>" + church.address);
        markers.addLayer(marker);

        var div = document.createElement('div');
        div.className = 'church-item';
        div.textContent = church.name;
        div.addEventListener('click', function() {
          map.setView([parseFloat(church.lat), parseFloat(church.lng)], 16);
          marker.openPopup();
        });
        churchList.appendChild(div);
      });

      map.addLayer(markers);
    }
  </script>
</body>
</html>
