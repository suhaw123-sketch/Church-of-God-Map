<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교회 위치 지도</title>

<!-- 카카오맵 API -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=73b507fb754b2820529d8dc82b379259"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100vh;
}

#loading {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #000;
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 10;
}
</style>
</head>

<body>

<div id="loading">📍 교회 위치 불러오는 중...</div>
<div id="map"></div>

<script>
// ============================
// 1. 지도 생성
// ============================
const mapContainer = document.getElementById('map');

const mapOption = {
  center: new kakao.maps.LatLng(37.5665, 126.9780),
  level: 8
};

const map = new kakao.maps.Map(mapContainer, mapOption);

// ============================
// 2. CSV 불러오기
// ============================
fetch('data/churches.csv')
  .then(response => response.text())
  .then(csvText => {

    console.log("CSV 확인:", csvText);

    const lines = csvText.split('\n');

    // header 제거
    lines.shift();

    let count = 0;

    lines.forEach(line => {

      if (!line.trim()) return;

      const cols = line.split(',');

      // 👉 컬럼 위치 수정 (중요)
      const name = cols[1];
      const lat = parseFloat(cols[9]);
      const lng = parseFloat(cols[10]);

      if (isNaN(lat) || isNaN(lng)) {
        console.log("좌표 오류:", cols);
        return;
      }

      const markerPosition = new kakao.maps.LatLng(lat, lng);

      const marker = new kakao.maps.Marker({
        position: markerPosition
      });

      marker.setMap(map);

      const infowindow = new kakao.maps.InfoWindow({
        content: `<div style="padding:5px;">${name}</div>`
      });

      kakao.maps.event.addListener(marker, 'click', function () {
        infowindow.open(map, marker);
      });

      count++;
    });

    document.getElementById('loading').innerText = `✅ ${count}개 로드 완료`;

    console.log("총 마커:", count);
  })
  .catch(error => {
    console.error('CSV 로딩 실패:', error);
    document.getElementById('loading').innerText = "❌ 데이터 불러오기 실패";
  });

</script>

</body>
</html>
