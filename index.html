<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>전세계/서울 교회 현황 지도 v3 (자동 업데이트)</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    /* === 기존 v3 스타일 그대로 === */
    :root{--border:#e9e9e9;--muted:#666;--bg:#fff;--chip:#f6f6f6;--radius:12px;--header-h:210px;--side-w:360px;}
    html,body{height:100%;margin:0;}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);overflow:hidden;}
    header{position:fixed;top:0;left:0;right:0;z-index:2000;padding:14px 14px 10px;border-bottom:1px solid var(--border);background:#fff;display:grid;gap:10px;box-sizing:border-box;}
    .titleRow{display:flex;justify-content:space-between;align-items:center;gap:12px;}
    .title{font-weight:800;font-size:22px;letter-spacing:-.3px;}
    .small{font-size:12px;color:var(--muted);}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    input[type="file"], input[type="text"], select{padding:10px 12px;border:1px solid #ddd;border-radius:10px;background:#fff;outline:none;}
    input[type="text"]{flex:1;min-width:260px;}
    select{min-width:140px;}
    button{padding:10px 12px;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    .chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid #eee;border-radius:999px;padding:2px 8px;font-size:12px;color:#333;}
    .dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .card{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:#fff;}
    .cardTitle{font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px;}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;}
    .list{margin:0;padding-left:18px;}
    .list li{margin:3px 0;}
    #wrap{position:fixed;top:var(--header-h);left:0;right:0;bottom:0;display:flex;min-height:0;}
    #mapWrap{flex:1 1 auto;position:relative;min-width:0;border-right:1px solid var(--border);}
    #map{height:100%;width:100%;background:#eef;}
    #side{width:var(--side-w);max-width:48vw;background:#fff;display:flex;flex-direction:column;min-height:0;}
    .sideHeader{padding:12px 12px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .sideTitle{font-weight:800;font-size:14px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;}
    .sideMeta{font-size:12px;color:var(--muted);white-space: nowrap;}
    #resultList{overflow:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:8px;}
    .item{border:1px solid #eee;border-radius:12px;padding:10px;cursor:pointer;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.03);}
    .item:hover{background:#fafafa;}
    .item.active{border-color:#222;box-shadow:0 2px 12px rgba(0,0,0,.10);}
    .itemName{font-weight:800;font-size:13px;margin-bottom:4px;}
    .itemAddr{font-size:12px;color:#444;line-height:1.35;}
    .itemSub{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;}
    .pill{font-size:11px;border:1px solid #eee;background:#f7f7f7;padding:2px 6px;border-radius:999px;}
    .mapLegend{position:absolute;bottom:20px;right:20px;background:rgba(255,255,255,0.95);backdrop-filter:blur(6px);padding:10px 14px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:8px;font-size:12px;z-index:1000;pointer-events:none;user-select:none;}
    .mapLegend .legendItem{display:flex;align-items:center;gap:8px;color:#222;white-space:nowrap;}
    .legendCount{color:#555;font-variant-numeric:tabular-nums;}
    @media(max-width:900px){.dash{grid-template-columns:1fr;}#side{width:44vw;}}
    @media(max-width:720px){#wrap{flex-direction:column;}#mapWrap{border-right:none;border-bottom:1px solid var(--border);height:58%;}#side{width:100%;max-width:none;height:42%;}}
  </style>
</head>
<body>

<header>
  <div class="titleRow">
    <div class="title">전세계/서울 교회 현황 지도 v3</div>
    <div class="small" id="status">대기 중…</div>
  </div>

  <div class="row">
    <button id="btnLoadWorld">전세계 불러오기</button>
    <button id="btnSeoulOnly" disabled>서울만 보기</button>
    <button id="btnShowAll" disabled>전체 보기</button>

    <!-- 업로드도 유지 -->
    <input id="file" type="file" accept=".csv,.json" />
    <input id="popFile" type="file" accept=".csv,.json" />

    <select id="countryFilter"><option value="all">모든 나라</option></select>
    <select id="cityFilter" disabled><option value="all">모든 도시</option></select>
    <select id="districtFilter" disabled><option value="all">모든 구/지역</option></select>
    <select id="typeFilter">
      <option value="all" selected>전체 유형</option>
      <option value="new">새성전</option>
      <option value="hall">현당/헌당</option>
      <option value="church">교회</option>
    </select>

    <form id="searchForm" style="display:flex;gap:10px;flex:1;">
      <input id="qAll" type="text" placeholder="검색 (예: 강남 / Seoul / 새성전 / 헌당)" />
      <button id="btnSearch" type="submit">검색</button>
    </form>

    <button id="btnReset" disabled>검색 해제</button>
    <button id="btnFit" disabled>전체 맞춤</button>
    <button id="btnClear" disabled>비우기</button>
  </div>

  <div class="dash">
    <div class="card">
      <div class="cardTitle">📊 통계 <span class="chip mono" id="chipValid">valid 0</span></div>
      <div class="small" id="statText">데이터 로딩 후 계산됩니다.</div>
      <div class="small mono" id="typeCounts">새성전 0 / 현당 0 / 교회 0</div>
    </div>
    <div class="card">
      <div class="cardTitle">🌍 대륙별 TOP <span class="chip mono" id="chipCont">all</span></div>
      <ul class="list small" id="continentTop"><li>-</li></ul>
    </div>
    <div class="card">
      <div class="cardTitle">🏳️ 국가별 TOP 10 <span class="chip mono" id="chipTop10">top10</span></div>
      <ul class="list small" id="countryTop10"><li>-</li></ul>
    </div>
    <div class="card">
      <div class="cardTitle">⚡ 성능/상태 <span class="chip mono" id="chipPerf">render -</span></div>
      <div class="small mono" id="perfText">데이터 rows: 0 / 현재 표시: 0</div>
      <div class="small mono" id="perfHint">chunkSize=800 (7,800+ 대응용)</div>
    </div>
  </div>
</header>

<div id="wrap">
  <div id="mapWrap">
    <div id="map"></div>
    <div class="mapLegend" aria-label="legend">
      <div class="legendItem">🔴 새성전 <span class="legendCount" id="legendNew">0</span></div>
      <div class="legendItem">🔵 현당/헌당 <span class="legendCount" id="legendHall">0</span></div>
      <div class="legendItem">🟡 교회 <span class="legendCount" id="legendChurch">0</span></div>
    </div>
  </div>
  <aside id="side">
    <div class="sideHeader">
      <div class="sideTitle">📌 연쇄 표시 목록</div>
      <div class="sideMeta" id="sideMeta">0개</div>
    </div>
    <div id="resultList"></div>
  </aside>
</div>

<script>
  const $ = id=>document.getElementById(id);

  // ✅ 절대경로로 고정 (루트 /index 어떤 페이지에서도 안 깨짐)
  const CHURCH_CSV_URL = "/Church-of-God-Map/data/churches.csv";

  const POP_RATE = 0.03;
  let populationMap = new Map();
  let allItems = [];
  let lastRendered = [];

  // 지도
  const map = L.map('map',{worldCopyJump:true}).setView([20,0],2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,noWrap:true,attribution:'&copy; OpenStreetMap'}).addTo(map);
  const cluster = L.markerClusterGroup({showCoverageOnHover:false,disableClusteringAtZoom:16,chunkedLoading:true});
  map.addLayer(cluster);

  function setStatus(msg){ $('status').textContent = msg; }

  // ======= CSV 파서(따옴표 대응 최소) =======
  function parseCSV(text){
    text = text.replace(/^\uFEFF/, ""); // BOM 제거
    const rows = [];
    let cur = [], val = "", inQuotes = false;

    const pushVal = ()=>{ cur.push(val); val=""; };
    const pushRow = ()=>{ if(cur.length===1 && cur[0].trim()===""){ cur=[]; return; } rows.push(cur); cur=[]; };

    for(let i=0;i<text.length;i++){
      const ch = text[i];
      if(inQuotes){
        if(ch === '"'){
          const next = text[i+1];
          if(next === '"'){ val += '"'; i++; }
          else inQuotes = false;
        } else val += ch;
      } else {
        if(ch === '"') inQuotes = true;
        else if(ch === ",") pushVal();
        else if(ch === "\n"){ pushVal(); pushRow(); }
        else if(ch === "\r"){ }
        else val += ch;
      }
    }
    pushVal(); pushRow();

    if(!rows.length) return [];
    const header = rows.shift().map(h=>h.trim());
    return rows.map(r=>{
      const o={};
      header.forEach((h,i)=>o[h]= (r[i] ?? "").trim());
      return o;
    });
  }

  // ======= URL에서 CSV 자동 로드 =======
  async function loadChurchCSVFromURL(){
    setStatus("전세계 CSV 불러오는 중…");
    const res = await fetch(CHURCH_CSV_URL, {cache:"no-store"});
    if(!res.ok) throw new Error(`CSV 로드 실패: ${res.status}`);
    const text = await res.text();
    allItems = parseCSV(text);
    setStatus(`교회 데이터 로드 ✅ ${allItems.length}개 (from ${CHURCH_CSV_URL})`);
    $('btnSeoulOnly').disabled = false;
    $('btnShowAll').disabled = false;
    render(allItems);
  }

  // ======= 파일 업로드 방식도 유지 =======
  async function handleFile(file){
    if(!file) return;
    setStatus('CSV 읽는 중…');
    try{
      const text = await file.text();
      allItems = parseCSV(text);
      setStatus(`교회 데이터 로드 ✅ ${allItems.length}개 (from upload)`);
      $('btnSeoulOnly').disabled = false;
      $('btnShowAll').disabled = false;
      render(allItems);
    }catch(e){ console.error(e); setStatus('CSV 파싱 실패'); }
  }

  function handlePopulationFile(file){
    if(!file) return;
    setStatus('인구 파일 읽는 중…');
    file.text().then(text=>{
      const rows = parseCSV(text);
      populationMap = new Map();
      rows.forEach(o=>{
        const key=`${o.country}|${o.city}|${o.district}`;
        const pop=Number(String(o.population||"").replace(/,/g,""));
        if(!isNaN(pop)) populationMap.set(key,pop);
      });
      setStatus(`인구 데이터 로드 ✅ ${populationMap.size}개`);
      if(allItems.length) render(allItems);
    });
  }

  // 파일 이벤트
  $('file').addEventListener('change', e=>handleFile(e.target.files[0]));
  $('popFile').addEventListener('change', e=>handlePopulationFile(e.target.files[0]));

  // ======= 렌더 =======
  function render(items){
    cluster.clearLayers();
    lastRendered=[];

    const normalized = items.map(it=>{
      const name = it.name || '';
      const address = it.address || '';
      const lat = Number(it.lat);
      const lng = Number(it.lng);

      // status 필드에 따라 type 결정(원문 로직 유지)
      const st = (it.status || "");
      const type = st.includes('새성전') ? 'new' : (st.includes('현당') || st.includes('헌당')) ? 'hall' : 'church';

      const key = `${it.country}|${it.city}|${it.district}`;
      const population = populationMap.get(key) || null;
      const people_per_church = population ? population*POP_RATE : null;

      return { raw:it, name, address, lat, lng, type, population, people_per_church, key };
    }).filter(it=>Number.isFinite(it.lat) && Number.isFinite(it.lng));

    // legend counts
    let cNew=0, cHall=0, cChurch=0;

    normalized.forEach(it=>{
      if(it.type==='new') cNew++;
      else if(it.type==='hall') cHall++;
      else cChurch++;

      const color = it.type==='new' ? '#ef4444' : it.type==='hall' ? '#3b82f6' : '#f59e0b';
      const marker = L.circleMarker([it.lat,it.lng],{radius:8,color:color,fillColor:color,fillOpacity:0.8})
        .bindPopup(`<b>${it.name}</b><br>${it.address}`);

      cluster.addLayer(marker);
      lastRendered.push({item:it, marker});
    });

    $('legendNew').textContent = String(cNew);
    $('legendHall').textContent = String(cHall);
    $('legendChurch').textContent = String(cChurch);

    $('chipValid').textContent = `valid ${normalized.length}`;
    $('typeCounts').textContent = `새성전 ${cNew} / 현당 ${cHall} / 교회 ${cChurch}`;
    $('sideMeta').textContent = `${normalized.length}개`;

    setStatus(`렌더 완료 ✅ 표시 ${normalized.length}개`);
    $('perfText').textContent = `데이터 rows: ${items.length} / 현재 표시: ${normalized.length}`;

    if(cluster.getLayers().length) map.fitBounds(cluster.getBounds(),{padding:[20,20]});
  }

  // 버튼 이벤트
  $('btnLoadWorld').addEventListener('click', ()=>{
    loadChurchCSVFromURL().catch(e=>{
      console.error(e);
      alert(`전세계 CSV 로드 실패\nURL: ${CHURCH_CSV_URL}\n에러: ${e.message}`);
      setStatus("전세계 CSV 로드 실패 ❌");
    });
  });

  $('btnSeoulOnly').addEventListener('click', ()=>{
    // city가 'Seoul' 또는 '서울'인 것만
    const only = allItems.filter(it => (it.city||"").toLowerCase()==="seoul" || (it.city||"").includes("서울"));
    render(only);
  });

  $('btnShowAll').addEventListener('click', ()=>render(allItems));

  // ✅ 페이지 로드 시 자동으로 전세계 불러오기(원치 않으면 아래 한 줄 삭제)
  loadChurchCSVFromURL().catch(e=>{
    console.error(e);
    setStatus("자동 로드 실패(전세계 버튼을 눌러 다시 시도)");
  });
</script>
</body>
</html>
