<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>전세계/서울 교회 현황 지도 v3</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
html,body{margin:0;height:100%;font-family:system-ui;}
header{padding:10px 14px;border-bottom:1px solid #eee;background:#fff}
#map{height:calc(100% - 140px)}
button{padding:6px 10px;margin-right:6px}
.small{font-size:12px;color:#666}
.card{padding:8px 0}
</style>
</head>

<body>

<header>
<h2>전세계/서울 교회 현황 지도 v3</h2>
<div class="card small">
<span id="chipValid">valid 0</span> |
<span id="chipPop">pop 0</span>
</div>
<button id="btnReload">전세계 불러오기</button>
<span class="small" id="status">대기중</span>
</header>

<div id="map"></div>

<script>
const AUTO_CSV_URL = 'data/churches.csv';
const AUTO_POP_URL = 'data/population.csv';
const POP_RATE = 0.03;

const map = L.map('map').setView([20,0],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19,attribution:'&copy; OpenStreetMap'
}).addTo(map);

const cluster = L.markerClusterGroup();
map.addLayer(cluster);

let populationMap = new Map();
let allItems = [];

function setStatus(t){document.getElementById('status').textContent=t}
function $(id){return document.getElementById(id)}

function parseCSV(text){
const rows=text.trim().split(/\r?\n/).map(r=>r.split(','));
const header=rows.shift();
return rows.map(r=>{
let o={};
header.forEach((h,i)=>o[h.trim()]=r[i]);
return o;
});
}

function adminKey(c,city,d){return `${c}|${city}|${d}`}

async function loadPopulation(){
try{
const res=await fetch(AUTO_POP_URL+"?v="+Date.now());
if(!res.ok) return false;
const text=await res.text();
const rows=parseCSV(text);
populationMap.clear();
rows.forEach(r=>{
if(r.country&&r.city&&r.district&&r.population){
populationMap.set(adminKey(r.country,r.city,r.district),Number(r.population));
}
});
$('chipPop').textContent="pop "+populationMap.size;
return true;
}catch(e){
console.log(e);
return false;
}
}

async function loadChurches(){
const res=await fetch(AUTO_CSV_URL+"?v="+Date.now());
const text=await res.text();
allItems=parseCSV(text);
$('chipValid').textContent="valid "+allItems.length;
}

function render(){
cluster.clearLayers();
allItems.forEach(it=>{
const lat=Number(it.lat);
const lng=Number(it.lng);
if(!lat||!lng) return;

const key=adminKey(it.country,it.city,it.district);
const pop=populationMap.get(key);
let ppc=null;

if(pop){
const count=allItems.filter(x=>adminKey(x.country,x.city,x.district)===key).length;
ppc=Math.round((pop*POP_RATE)/count);
}

const popup=`
<b>${it.name}</b><br>
${it.country} / ${it.city} / ${it.district}<br>
${it.address}<br>
${pop?`인구: ${pop.toLocaleString()}`:`인구: (매칭 없음)`}<br>
${ppc?`교회당 인구(3%): ${ppc.toLocaleString()}`:`교회당 인구: (계산 불가)`}
`;

const marker=L.marker([lat,lng]).bindPopup(popup);
cluster.addLayer(marker);
});

if(cluster.getLayers().length){
map.fitBounds(cluster.getBounds());
}
}

async function loadAll(){
setStatus("인구 로드 중...");
await loadPopulation();
setStatus("교회 데이터 로드 중...");
await loadChurches();
render();
setStatus("완료");
}

document.getElementById('btnReload').addEventListener('click',loadAll);

loadAll();
</script>

</body>
</html>
