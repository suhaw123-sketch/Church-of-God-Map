<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>전세계/서울 교회 현황 지도 v3 (자동 업데이트 + CSV)</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- PapaParse (CSV 파싱용) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 75%; float: left; }
    #sidebar { height: 100%; width: 25%; float: left; overflow-y: auto; padding: 10px; box-sizing: border-box; border-left: 1px solid #ccc; }
    .church-item { cursor: pointer; margin-bottom: 8px; padding: 4px; border-bottom: 1px solid #eee; }
    .church-item:hover { background-color: #f0f0f0; }
    #filters { margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <div id="filters">
      <label for="countryFilter">나라: </label>
      <select id="countryFilter"><option value="">전체</option></select>
      <br>
      <label for="cityFilter">지역: </label>
      <select id="cityFilter"><option value="">전체</option></select>
    </div>
    <div id="churchList"></div>
  </div>

  <script>
    var map = L.map('map').setView([37.5665, 126.9780], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var markers = L.markerClusterGroup();
    var allChurches = [];

    // CSV 불러오기 + 자동 업데이트
    async function loadChurchData() {
      try {
        const res = await fetch('data/churches.csv');
        const csvText = await res.text();
        const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
        allChurches = parsed.data;
        
        await geocodeMissing(allChurches);
        updateFilters();
        updateMap();
      } catch(e){
        console.error('CSV 로드 오류:', e);
      }
    }

    // 주소 → 좌표 변환
    async function geocodeMissing(churches){
      const delay = ms => new Promise(r=>setTimeout(r, ms));
      for(let church of churches){
        if(!church.lat || !church.lng){
          const query = encodeURIComponent(church.address);
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${query}`;
          try {
            const res = await fetch(url, {headers:{'Accept-Language':'ko'}});
            const data = await res.json();
            if(data.length>0){
              church.lat = data[0].lat;
              church.lng = data[0].lon;
            }
          } catch(e){ console.error('Geocoding error:', e); }
          await delay(1000);
        }
      }
    }

    // 필터 업데이트
    function updateFilters(){
      const countrySelect = document.getElementById('countryFilter');
      const citySelect = document.getElementById('cityFilter');

      countrySelect.innerHTML = '<option value="">전체</option>';
      citySelect.innerHTML = '<option value="">전체</option>';

      const countries = [...new Set(allChurches.map(c=>c.country).filter(c=>c))];
      const cities = [...new Set(allChurches.map(c=>c.city).filter(c=>c))];

      countries.forEach(c=>countrySelect.appendChild(new Option(c,c)));
      cities.forEach(c=>citySelect.appendChild(new Option(c,c)));

      countrySelect.onchange = updateMap;
      citySelect.onchange = updateMap;
    }

    // 지도 + 목록 업데이트
    function updateMap(){
      markers.clearLayers();
      const country = document.getElementById('countryFilter').value;
      const city = document.getElementById('cityFilter').value;

      const filtered = allChurches.filter(c=>c.lat && c.lng)
                                  .filter(c=>(!country || c.country===country) && (!city || c.city===city));

      const churchList = document.getElementById('churchList');
      churchList.innerHTML = '';

      filtered.forEach(church=>{
        const marker = L.marker([parseFloat(church.lat), parseFloat(church.lng)])
                        .bindPopup("<b>"+church.name+"</b><br>"+church.address);
        markers.addLayer(marker);

        const div = document.createElement('div');
        div.className = 'church-item';
        div.textContent = church.name;
        div.onclick = ()=>{ map.setView([parseFloat(church.lat), parseFloat(church.lng)],16); marker.openPopup(); }
        churchList.appendChild(div);
      });

      map.addLayer(markers);
    }

    // 30초마다 CSV 자동 재로드
    setInterval(loadChurchData, 30000);
    loadChurchData(); // 초기 로드
  </script>
</body>
</html>
