<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>전세계 하나님의교회 지도</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
header{position:fixed;top:0;left:0;right:0;height:60px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 12px;z-index:1000}
#wrap{position:absolute;top:60px;bottom:0;left:0;right:0;display:flex}
#map{flex:1}
aside{width:360px;border-left:1px solid #eee;background:#fff;display:flex;flex-direction:column}
.panel{padding:10px;border-bottom:1px solid #eee;display:grid;gap:8px}
input,select,button{padding:8px;border:1px solid #ddd;border-radius:8px}
.list{flex:1;overflow:auto;list-style:none;margin:0;padding:0}
.item{padding:10px;border-bottom:1px solid #eee;cursor:pointer}
.item:hover{background:#fafafa}
</style>
</head>

<body>
<header>
<b>전세계 하나님의교회 지도</b>
<span id="status" style="margin-left:10px;color:#666;font-size:13px;">로드 중...</span>
</header>

<div id="wrap">
<div id="map"></div>

<aside>
<div class="panel">
<input id="q" placeholder="검색 후 Enter"/>
<button onclick="applyFilters(true)">검색</button>
</div>
<ul class="list" id="list"></ul>
</aside>
</div>

<script>
const $=id=>document.getElementById(id);
function setStatus(t){$('status').textContent=t;}
function stripBOM(s){return String(s||'').replace(/^\uFEFF/,'');}
function parseNumber(x){
  if(x==null)return null;
  const n=Number(String(x).trim().replace(/,/g,'.'));
  return Number.isFinite(n)?n:null;
}

/* =========================
   ⭐ CSV 자동 인식 (핵심 수정)
========================= */
function normalizeCSV(text){
  text=stripBOM(text).trim();
  const first=text.split(/\r?\n/)[0]||'';
  if(first.includes(',')) return text;
  if(first.includes('\t')) return text.replace(/\t/g,',');
  return text.replace(/ {2,}|\s{2,}/g,',');
}

function parseCSV(text){
  const rows=[];
  let cur='',inQuotes=false,out=[];
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch=='"'){
      if(inQuotes&&next=='"'){cur+='"';i++;}
      else inQuotes=!inQuotes;
    }else if(ch==','&&!inQuotes){
      out.push(cur);cur='';
    }else if((ch=='\n'||ch=='\r')&&!inQuotes){
      if(ch=='\r'&&next=='\n')i++;
      out.push(cur);rows.push(out.slice());
      out=[];cur='';
    }else cur+=ch;
  }
  out.push(cur);rows.push(out);
  return rows;
}

function rowsToObjects(rows){
  if(!rows.length)return[];
  const header=rows[0].map(h=>h.trim());
  const objs=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(r.every(v=>String(v||'').trim()===''))continue;
    const o={};
    for(let c=0;c<header.length;c++)o[header[c]]=r[c]??'';
    objs.push(o);
  }
  return objs;
}

/* ========================= */

const map=L.map('map').setView([20,0],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const cluster=L.markerClusterGroup();
map.addLayer(cluster);

let allItems=[];
let currentFiltered=[];

async function loadData(){
  setStatus("CSV 불러오는 중...");
  try{
    let res=await fetch("./data/churches.csv",{cache:'no-store'});
    let text=await res.text();
    text=normalizeCSV(text);
    const rows=parseCSV(text);
    allItems=rowsToObjects(rows);
    applyFilters(true);
  }catch(e){
    setStatus("CSV 로드 실패");
  }
}

function applyFilters(fit=false){
  const q=String($('q').value||'').toLowerCase();
  currentFiltered=allItems.filter(it=>{
    const lat=parseNumber(it.lat||it.Lat);
    const lng=parseNumber(it.lng||it.Lng);
    if(lat==null||lng==null)return false;
    if(!q)return true;
    return Object.values(it).join(' ').toLowerCase().includes(q);
  });
  render();
  setStatus(`로드 완료 ${currentFiltered.length}개 / 전체 ${allItems.length}개`);
  if(fit)fitBounds();
}

function render(){
  cluster.clearLayers();
  $('list').innerHTML='';
  currentFiltered.forEach(it=>{
    const lat=parseNumber(it.lat||it.Lat);
    const lng=parseNumber(it.lng||it.Lng);
    const marker=L.marker([lat,lng]).bindPopup(`<b>${it.name||''}</b><br>${it.address||''}`);
    cluster.addLayer(marker);
    const li=document.createElement('li');
    li.className='item';
    li.textContent=it.name||'';
    li.onclick=()=>{map.setView([lat,lng],10);marker.openPopup();}
    $('list').appendChild(li);
  });
}

function fitBounds(){
  if(!currentFiltered.length)return;
  const bounds=L.featureGroup(cluster.getLayers()).getBounds();
  map.fitBounds(bounds.pad(0.2));
}

$('q').addEventListener('keydown',e=>{
  if(e.key==="Enter")applyFilters(true);
});

loadData();
</script>
</body>
</html>
