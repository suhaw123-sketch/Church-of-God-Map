<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>전세계/서울 교회 현황 지도 v3 (최종)</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    :root{--border:#e9e9e9;--muted:#666;--bg:#fff;--chip:#f6f6f6;--radius:12px;--header-h:210px;--side-w:360px;}
    html,body{height:100%;margin:0;}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);overflow:hidden;}
    header{position:fixed;top:0;left:0;right:0;z-index:2000;padding:14px 14px 10px;border-bottom:1px solid var(--border);background:#fff;display:grid;gap:10px;box-sizing:border-box;}
    .titleRow{display:flex;justify-content:space-between;align-items:center;gap:12px;}
    .title{font-weight:800;font-size:22px;letter-spacing:-.3px;}
    .small{font-size:12px;color:var(--muted);}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    input[type="file"], input[type="text"], select{padding:10px 12px;border:1px solid #ddd;border-radius:10px;background:#fff;outline:none;}
    input[type="text"]{flex:1;min-width:260px;}
    select{min-width:140px;}
    button{padding:10px 12px;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    .chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid #eee;border-radius:999px;padding:2px 8px;font-size:12px;color:#333;}
    .dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .card{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:#fff;}
    .cardTitle{font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px;}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;}
    .list{margin:0;padding-left:18px;}
    .list li{margin:3px 0;}

    #wrap{position:fixed;top:var(--header-h);left:0;right:0;bottom:44px;display:flex;min-height:0;}
    #mapWrap{flex:1 1 auto;position:relative;min-width:0;border-right:1px solid var(--border);}
    #map{height:100%;width:100%;background:#eef;}
    #side{width:var(--side-w);max-width:48vw;background:#fff;display:flex;flex-direction:column;min-height:0;}
    .sideHeader{padding:12px 12px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .sideTitle{font-weight:800;font-size:14px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;}
    .sideMeta{font-size:12px;color:var(--muted);white-space: nowrap;}
    #resultList{overflow:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:8px;}
    .item{border:1px solid #eee;border-radius:12px;padding:10px;cursor:pointer;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.03);}
    .item:hover{background:#fafafa;}
    .item.active{border-color:#222;box-shadow:0 2px 12px rgba(0,0,0,.10);}
    .itemName{font-weight:800;font-size:13px;margin-bottom:4px;}
    .itemAddr{font-size:12px;color:#444;line-height:1.35;}
    .itemSub{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;}
    .pill{font-size:11px;border:1px solid #eee;background:#f7f7f7;padding:2px 6px;border-radius:999px;}

    .mapLegend{position:absolute;bottom:20px;right:20px;background:rgba(255,255,255,0.95);backdrop-filter:blur(6px);padding:10px 14px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:8px;font-size:12px;z-index:1000;pointer-events:none;user-select:none;}
    .mapLegend .legendItem{display:flex;align-items:center;gap:8px;color:#222;white-space:nowrap;}
    .legendCount{color:#555;font-variant-numeric:tabular-nums;}

    #bottomNote{
      position:fixed;left:0;right:0;bottom:0;z-index:2600;
      background:#fff;border-top:1px solid var(--border);
      padding:10px 14px;color:var(--muted);font-size:11px;line-height:1.45;
      box-sizing:border-box;
    }

    @media(max-width:900px){.dash{grid-template-columns:1fr;}#side{width:44vw;}}
    @media(max-width:720px){#wrap{flex-direction:column;}#mapWrap{border-right:none;border-bottom:1px solid var(--border);height:58%;}#side{width:100%;max-width:none;height:42%;}}
  </style>
</head>
<body>

<header>
  <div class="titleRow">
    <div class="title">전세계/서울 교회 현황 지도 v3</div>
    <div class="small" id="status">대기 중…</div>
  </div>

  <div class="row">
    <button id="btnLoadWorld">전세계 불러오기</button>
    <button id="btnSeoulOnly" disabled>서울만 보기</button>
    <button id="btnShowAll" disabled>전체 보기</button>

    <!-- 업로드 옵션도 유지 -->
    <input id="file" type="file" accept=".csv,.json,.tsv" />
    <input id="popFile" type="file" accept=".csv,.json,.tsv" />

    <select id="typeFilter">
      <option value="all" selected>전체 유형</option>
      <option value="new">새성전</option>
      <option value="hall">현당/헌당</option>
      <option value="church">교회</option>
    </select>

    <form id="searchForm" style="display:flex;gap:10px;flex:1;">
      <input id="qAll" type="text" placeholder="검색 (예: 강남 / Seoul / 새성전 / 헌당)" />
      <button id="btnSearch" type="submit">검색</button>
    </form>
  </div>

  <div class="dash">
    <div class="card">
      <div class="cardTitle">📊 통계 <span class="chip mono" id="chipValid">valid 0</span></div>
      <div class="small" id="statText">데이터 로딩 후 계산됩니다.</div>
      <div class="small mono" id="typeCounts">새성전 0 / 현당 0 / 교회 0</div>
    </div>

    <div class="card">
      <div class="cardTitle">🌍 대륙별 TOP <span class="chip mono" id="chipCont">top</span></div>
      <ul class="list small" id="continentTop"><li>-</li></ul>
    </div>

    <div class="card">
      <div class="cardTitle">🏳️ 국가별 TOP 10 <span class="chip mono" id="chipTop10">top10</span></div>
      <ul class="list small" id="countryTop10"><li>-</li></ul>
    </div>

    <div class="card">
      <div class="cardTitle">⚡ 성능/상태 <span class="chip mono" id="chipPerf">render</span></div>
      <div class="small mono" id="perfText">rows: 0 / 표시: 0 / 인구매칭: 0</div>
      <div class="small mono" id="perfHint">인구×3% / 수도권 1000 / 지방 300</div>
    </div>
  </div>
</header>

<div id="wrap">
  <div id="mapWrap">
    <div id="map"></div>
    <div class="mapLegend" aria-label="legend">
      <div class="legendItem">🔴 새성전 <span class="legendCount" id="legendNew">0</span></div>
      <div class="legendItem">🔵 현당/헌당 <span class="legendCount" id="legendHall">0</span></div>
      <div class="legendItem">🟡 교회 <span class="legendCount" id="legendChurch">0</span></div>
    </div>
  </div>

  <aside id="side">
    <div class="sideHeader">
      <div class="sideTitle">📌 표시 목록</div>
      <div class="sideMeta" id="sideMeta">0개</div>
    </div>
    <div id="resultList"></div>
  </aside>
</div>

<div id="bottomNote">
  ✅ 자동 로드: <b class="mono">data/churches.csv</b> + <b class="mono">data/population.csv</b>
  &nbsp;|&nbsp; 🔄 수정 후 <b>Ctrl + Shift + R</b>
</div>

<script>
  const $ = id => document.getElementById(id);

  // === 경로(절대경로) ===
  const CHURCH_CSV_URL = "/Church-of-God-Map/data/churches.csv";
  const POP_CSV_URL    = "/Church-of-God-Map/data/population.csv";

  // === 규칙 ===
  const POP_RATE = 0.03; // 전체 인구 중 3%
  const CAPITAL_CITIES = new Set(["서울","서울특별시","경기","경기도","인천","인천광역시"]);

  function setStatus(msg){ $("status").textContent = msg; }

  function escapeHtml(s){
    return String(s??"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }

  // ✅ city 정규화(Seoul ↔ 서울)
  function normCity(country, city){
    const ctry = String(country||"").trim().toLowerCase();
    let c = String(city||"").trim();
    if(ctry.includes("korea") || ctry.includes("대한민국")){
      if(c.toLowerCase()==="seoul") c = "서울";
    }
    return c;
  }

  function isCapitalArea(countryRaw, cityRaw){
    const country = String(countryRaw || "").trim().toLowerCase();
    const city = String(cityRaw || "").trim();
    const isKorea = country.includes("korea") || country.includes("대한민국");
    if(!isKorea) return false;
    for(const k of CAPITAL_CITIES){
      if(city.includes(k)) return true;
    }
    return false;
  }

  function calcNeedChurchesFromPopulation(population, capital){
    if(!Number.isFinite(population) || population <= 0) return 0;
    const targetPeople = population * POP_RATE;
    const denom = capital ? 1000 : 300;
    return Math.ceil(targetPeople / denom);
  }

  // ✅ CSV/TSV 자동 파서(탭이면 TSV로 처리)
  function parseTable(text){
    text = String(text||"").replace(/^\uFEFF/,"").trim();
    if(!text) return [];
    const firstLine = text.split(/\r?\n/,1)[0] || "";
    const isTSV = firstLine.includes("\t") && !firstLine.includes(",");

    if(isTSV){
      const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
      const header = lines.shift().split("\t").map(s=>s.trim());
      return lines.map(line=>{
        const cols = line.split("\t");
        const o = {};
        header.forEach((h,i)=> o[h] = (cols[i] ?? "").trim());
        return o;
      });
    }

    // CSV(콤마) - 따옴표 지원
    const rows = [];
    let cur = [], val = "", inQuotes = false;

    const pushVal = ()=>{ cur.push(val); val=""; };
    const pushRow = ()=>{
      if(cur.length===1 && String(cur[0]||"").trim()===""){ cur=[]; return; }
      rows.push(cur); cur=[];
    };

    for(let i=0;i<text.length;i++){
      const ch = text[i];
      if(inQuotes){
        if(ch === '"'){
          const next = text[i+1];
          if(next === '"'){ val += '"'; i++; }
          else inQuotes = false;
        } else val += ch;
      } else {
        if(ch === '"') inQuotes = true;
        else if(ch === ",") pushVal();
        else if(ch === "\n"){ pushVal(); pushRow(); }
        else if(ch === "\r"){ }
        else val += ch;
      }
    }
    pushVal(); pushRow();

    if(!rows.length) return [];
    const header = rows.shift().map(h=>String(h||"").trim());
    return rows.map(r=>{
      const o = {};
      header.forEach((h,i)=> o[h] = String(r[i] ?? "").trim());
      return o;
    });
  }

  // === 데이터 ===
  let populationMap = new Map(); // key: country|city|district
  let allItems = [];
  let lastRendered = [];

  function popKey(country, city, district){
    return `${String(country||"").trim()}|${normCity(country, city)}|${String(district||"").trim()}`;
  }

  // === 지도 ===
  const map = L.map('map',{worldCopyJump:true}).setView([20,0],2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,noWrap:true,attribution:'&copy; OpenStreetMap'}).addTo(map);
  const cluster = L.markerClusterGroup({showCoverageOnHover:false,disableClusteringAtZoom:16,chunkedLoading:true});
  map.addLayer(cluster);

  async function loadChurchCSVFromURL(){
    setStatus("교회 CSV 불러오는 중…");
    const res = await fetch(CHURCH_CSV_URL, { cache:"no-store" });
    if(!res.ok) throw new Error(`교회 CSV 로드 실패: ${res.status}`);
    const text = await res.text();
    allItems = parseTable(text);
    $("btnSeoulOnly").disabled = false;
    $("btnShowAll").disabled = false;
    setStatus(`교회 데이터 로드 ✅ ${allItems.length}개`);
  }

  async function loadPopulationCSVFromURL(){
    setStatus("인구 CSV 불러오는 중…");
    const res = await fetch(POP_CSV_URL, { cache:"no-store" });
    if(!res.ok) throw new Error(`인구 CSV 로드 실패: ${res.status}`);
    const text = await res.text();
    const rows = parseTable(text);

    populationMap = new Map();
    rows.forEach(o=>{
      const key = popKey(o.country, o.city, o.district);
      const pop = Number(String(o.population||"").replace(/,/g,""));
      if(key !== "||" && Number.isFinite(pop)) populationMap.set(key, pop);
    });

    setStatus(`인구 데이터 로드 ✅ ${populationMap.size}개`);
  }

  // 업로드 옵션(선택)
  async function handleChurchUpload(file){
    if(!file) return;
    setStatus("교회 업로드 읽는 중…");
    const text = await file.text();
    allItems = parseTable(text);
    $("btnSeoulOnly").disabled = false;
    $("btnShowAll").disabled = false;
    setStatus(`교회 업로드 ✅ ${allItems.length}개`);
    render(allItems);
  }
  async function handlePopUpload(file){
    if(!file) return;
    setStatus("인구 업로드 읽는 중…");
    const text = await file.text();
    const rows = parseTable(text);
    populationMap = new Map();
    rows.forEach(o=>{
      const key = popKey(o.country, o.city, o.district);
      const pop = Number(String(o.population||"").replace(/,/g,""));
      if(key !== "||" && Number.isFinite(pop)) populationMap.set(key, pop);
    });
    setStatus(`인구 업로드 ✅ ${populationMap.size}개`);
    if(allItems.length) render(allItems);
  }

  $("file").addEventListener("change", e=>handleChurchUpload(e.target.files[0]));
  $("popFile").addEventListener("change", e=>handlePopUpload(e.target.files[0]));

  // === TOP 집계 ===
  function inc(map, key, by=1){
    const k = String(key??"").trim();
    if(!k) return;
    map.set(k, (map.get(k) || 0) + by);
  }
  function topN(map, n){
    return Array.from(map.entries()).sort((a,b)=>b[1]-a[1]).slice(0,n);
  }

  // === 렌더 ===
  function render(items){
    cluster.clearLayers();
    lastRendered = [];
    $("resultList").innerHTML = "";

    const tf = $("typeFilter").value;
    const q = String($("qAll").value || "").trim().toLowerCase();

    const normalized = items.map(it=>{
      const name = it.name || "";
      const address = it.address || "";
      const lat = Number(it.lat);
      const lng = Number(it.lng);

      const st = (it.status || "");
      const type = st.includes("새성전") ? "new" : (st.includes("현당") || st.includes("헌당")) ? "hall" : "church";

      const key = popKey(it.country, it.city, it.district);
      const population = populationMap.get(key) ?? null;

      const capital = isCapitalArea(it.country, normCity(it.country, it.city));
      const needChurches = population ? calcNeedChurchesFromPopulation(population, capital) : 0;

      return { raw:it, name, address, lat, lng, type, key, population, capital, needChurches };
    })
    .filter(it=>Number.isFinite(it.lat) && Number.isFinite(it.lng))
    .filter(it=> tf==="all" ? true : it.type===tf)
    .filter(it=>{
      if(!q) return true;
      const blob = `${it.name} ${it.address} ${it.raw.continent||""} ${it.raw.country||""} ${it.raw.city||""} ${it.raw.district||""} ${it.raw.status||""}`.toLowerCase();
      return blob.includes(q);
    });

    // 카운트/합계
    let cNew=0, cHall=0, cChurch=0;
    let sumNeed=0, sumNeedCapital=0, sumNeedLocal=0;
    let matchedPop=0;

    // TOP 집계
    const contMap = new Map();
    const countryMap = new Map();

    normalized.forEach(it=>{
      if(it.type==='new') cNew++; else if(it.type==='hall') cHall++; else cChurch++;
      if(it.population) matchedPop++;
      sumNeed += it.needChurches;
      if(it.needChurches){
        if(it.capital) sumNeedCapital += it.needChurches;
        else sumNeedLocal += it.needChurches;
      }

      inc(contMap, it.raw.continent || "Unknown");
      inc(countryMap, it.raw.country || "Unknown");

      const color = it.type==='new' ? '#ef4444' : it.type==='hall' ? '#3b82f6' : '#f59e0b';
      const popup = `
        <b>${escapeHtml(it.name)}</b><br>
        ${escapeHtml(it.raw.country||"")} / ${escapeHtml(normCity(it.raw.country,it.raw.city)||"")} / ${escapeHtml(it.raw.district||"")}<br>
        ${escapeHtml(it.address)}<br>
        <b>인구</b>: ${it.population ? it.population.toLocaleString() : "-"}<br>
        <b>적정인원(3%)</b>: ${it.population ? Math.round(it.population*POP_RATE).toLocaleString() : "-"}<br>
        <b>예상 필요 교회수</b>: ${it.needChurches} (${it.capital ? "수도권/1000" : "지방/300"})
      `;
      const marker = L.circleMarker([it.lat,it.lng],{radius:8,color:color,fillColor:color,fillOpacity:0.85}).bindPopup(popup);
      cluster.addLayer(marker);
      lastRendered.push({item:it, marker});
    });

    // 목록
    const listEl = $("resultList");
    normalized.forEach((it, idx)=>{
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div class="itemName">${escapeHtml(it.name)}</div>
        <div class="itemAddr">${escapeHtml(it.address)}</div>
        <div class="itemSub">
          <span class="pill">${escapeHtml(it.raw.country||"")}</span>
          <span class="pill">${escapeHtml(normCity(it.raw.country,it.raw.city)||"")}</span>
          <span class="pill">${escapeHtml(it.raw.district||"")}</span>
          <span class="pill">예상 ${it.needChurches}개</span>
        </div>
      `;
      div.addEventListener("click", ()=>{
        const obj = lastRendered[idx];
        if(obj?.marker){
          map.setView(obj.marker.getLatLng(), 15, {animate:true});
          obj.marker.openPopup();
        }
      });
      listEl.appendChild(div);
    });

    // UI 업데이트
    $("legendNew").textContent = String(cNew);
    $("legendHall").textContent = String(cHall);
    $("legendChurch").textContent = String(cChurch);

    $("chipValid").textContent = `valid ${normalized.length}`;
    $("typeCounts").textContent = `새성전 ${cNew} / 현당 ${cHall} / 교회 ${cChurch}`;

    $("sideMeta").textContent = `${normalized.length}개`;
    $("perfText").textContent = `rows: ${items.length} / 표시: ${normalized.length} / 인구매칭: ${matchedPop}`;

    $("statText").textContent =
      `예상 필요 교회수(인구 3%): ${sumNeed.toLocaleString()}개 (수도권 ${sumNeedCapital.toLocaleString()} / 지방 ${sumNeedLocal.toLocaleString()})`;

    // TOP 출력
    const contTop = topN(contMap, 6);
    const countryTop = topN(countryMap, 10);

    $("continentTop").innerHTML = contTop.length
      ? contTop.map(([k,v])=>`<li>${escapeHtml(k)} <span class="mono">(${v})</span></li>`).join("")
      : "<li>-</li>";

    $("countryTop10").innerHTML = countryTop.length
      ? countryTop.map(([k,v])=>`<li>${escapeHtml(k)} <span class="mono">(${v})</span></li>`).join("")
      : "<li>-</li>";

    setStatus(`렌더 완료 ✅ 표시 ${normalized.length}개`);

    if(cluster.getLayers().length){
      map.fitBounds(cluster.getBounds(), {padding:[20,20]});
    }
  }

  // 버튼/이벤트
  $("btnLoadWorld").addEventListener("click", async ()=>{
    try{
      await loadChurchCSVFromURL();
      await loadPopulationCSVFromURL();
      render(allItems);
    }catch(e){
      console.error(e);
      alert(`로드 실패: ${e.message}`);
      setStatus("로드 실패 ❌");
    }
  });

  $("btnSeoulOnly").addEventListener("click", ()=>{
    const only = allItems.filter(it => {
      const c = normCity(it.country, it.city);
      return c.includes("서울") || c.toLowerCase()==="seoul";
    });
    render(only);
  });

  $("btnShowAll").addEventListener("click", ()=>render(allItems));

  $("searchForm").addEventListener("submit", (e)=>{
    e.preventDefault();
    render(allItems);
  });
  $("typeFilter").addEventListener("change", ()=>render(allItems));

  // 자동 로드
  (async ()=>{
    try{
      await loadChurchCSVFromURL();
      await loadPopulationCSVFromURL();
      render(allItems);
    }catch(e){
      console.error(e);
      setStatus("자동 로드 실패(전세계 불러오기 버튼으로 재시도)");
    }
  })();
</script>
</body>
</html>
